<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23384d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cuaderno de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app de una mano — cabecera fija, vista con scroll, barra inferior de 3 pestañas; hojas inferiores para crear/editar */
:root{
  --bg:#eeefea; --surface:#ffffff; --sunk:#e3e4de; --line:#cfd1c8;
  --fg:#1d2023; --muted:#5d636a;
  --accent:#f2b705; --accent-fg:#1d2023; --ink:#23384d;
  --danger:#c2412d; --ok:#2f7a4a;
  --f1:#f2b705; --f2:#d9622b; --f3:#2f7fb5; --f4:#3c8f5a; --f5:#8a5cc2; --f6:#7a7f86;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px; --hh:60px; --ev-bg:#dbe5ef; --ev-bar:#23384d; --now:#d63a2a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181b; --surface:#1f2327; --sunk:#2a2f34; --line:#373d43;
  --fg:#eceee8; --muted:#9aa1a8; --accent:#f5c22e; --accent-fg:#15181b; --ink:#9cc2e6;
  --danger:#ec7a62; --ok:#6cc58c; --ev-bg:#243647; --ev-bar:#9cc2e6; --now:#ff6a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1f2327; --sunk:#2a2f34; --line:#373d43;
  --fg:#eceee8; --muted:#9aa1a8; --accent:#f5c22e; --accent-fg:#15181b; --ink:#9cc2e6;
  --danger:#ec7a62; --ok:#6cc58c; --ev-bg:#243647; --ev-bar:#9cc2e6; --now:#ff6a55; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-block:10px}
:root{--ink-fg:#fff}
header.top .row{display:flex;align-items:center;gap:10px;min-height:40px}
header.top h1{font:700 22px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#0d1013}}
:root[data-theme="dark"] header.top{background:#0d1013}
.back{background:transparent;border:0;color:inherit;width:40px;height:40px;margin-left:-8px;border-radius:10px;display:grid;place-items:center}
.stamp{font:500 12px var(--mono);opacity:.8;white-space:nowrap}

main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:18px}
h2.sec{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.secrow{display:flex;align-items:center;justify-content:space-between;gap:12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 13px var(--body);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.badge{position:absolute;top:8px;left:calc(50% + 8px);background:var(--danger);color:#fff;font:600 11px/18px var(--body);min-width:18px;height:18px;border-radius:9px;padding:0 5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn svg{width:20px;height:20px;flex:none}
.btn:disabled{opacity:.5}

/* Hoy */
.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.today .ev{display:flex;gap:12px;align-items:baseline}
.today .t{font:500 14px var(--mono);color:var(--muted);min-width:46px}
.today .empty{color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:left}

/* carpetas */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:14px 12px 12px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:104px;position:relative;min-width:0}
.folder .cover{aspect-ratio:4/3;max-width:100%;background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--muted)}
.folder .cover img{width:100%;height:100%;object-fit:cover;display:block}
.folder .tab{position:absolute;left:0;top:0;bottom:0;width:6px}
.folder .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.folder .name{font:700 23px/1.1 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.folder .count{font:500 12px var(--mono);color:var(--muted)}
.folder.add{border-style:dashed;align-items:center;justify-content:center;min-height:104px;padding:12px;color:var(--muted);font-weight:600;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.emptybox{border:1.5px dashed var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;color:var(--muted)}
.emptybox strong{color:var(--fg);font:700 20px/1.2 var(--display)}

/* cuaderno */
.capture{display:grid;grid-template-columns:1fr auto;gap:10px}
.capture .btn.pri{min-height:58px;font-size:18px}
.capture .btn{min-height:58px}
.search{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px}
.entries{display:flex;flex-direction:column;gap:14px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.entry .ph{display:block;width:100%;padding:0;border:0;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.entry .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--sunk)}
.pgrid button{padding:0;border:0;aspect-ratio:1;max-width:100%;position:relative;background:var(--sunk)}
.pgrid button img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .one{grid-column:span 2;aspect-ratio:4/3}
.pgrid .wide{grid-column:span 2;aspect-ratio:2/1}
.pgrid .more{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font:700 30px var(--display);display:grid;place-items:center}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .rm{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.th .rm svg{width:16px;height:16px}
.th.addt{border:1.5px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);padding:0}
.th.addt svg{width:26px;height:26px}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.viewer .nav svg{width:26px;height:26px}
.viewer .nav.p{left:env(safe-area-inset-left,0px);border-radius:0 10px 10px 0}
.viewer .nav.n{right:env(safe-area-inset-right,0px);border-radius:10px 0 0 10px}
.viewer .vc{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));color:#fff;font:500 14px var(--mono);background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px}
.entry .body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px}
.entry .ref{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.entry .desc{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.entry .desc.none{color:var(--muted);font-style:italic}
.entry .acts{display:flex;gap:8px;justify-content:flex-end}
.pending-up{opacity:.6}

/* calendario */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cal .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal .head .m{flex:1;font:700 20px var(--display);text-transform:capitalize}
.iconbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.grid7 .dow{font:600 12px var(--display);letter-spacing:.08em;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 15px var(--body);font-variant-numeric:tabular-nums;position:relative}
.day.out{color:var(--muted);opacity:.45}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--danger)}
.events{display:flex;flex-direction:column;gap:10px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.event .time{font:500 15px var(--mono);grid-row:span 2}
.event .title{font-weight:600;overflow-wrap:anywhere;min-width:0}
.event .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere;min-width:0}
.event .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bell{display:inline-flex;align-items:center;gap:4px}
.bell svg{width:14px;height:14px}

/* vista de día tipo agenda */
.cal .m{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:6px}
.cal .m svg{width:18px;height:18px;transition:transform .15s}
.cal .m[aria-expanded="true"] svg{transform:rotate(90deg)}
.dayhead{display:flex;align-items:center;gap:8px}
.dayhead h2{flex:1;margin:0;font:700 22px/1.1 var(--display);text-transform:capitalize;min-width:0}
.dayhead .rel{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.allday{display:flex;flex-direction:column;gap:6px}
.allday .blk{position:static;height:auto}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 0;touch-action:pan-y}
.tl{display:grid;grid-template-columns:52px 1fr;position:relative}
.tl .hrs{display:flex;flex-direction:column}
.tl .hrs span{height:var(--hh);font:500 12px var(--mono);color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.tl .hrs span:first-child{transform:none}
.lane{position:relative;border-left:1px solid var(--line);cursor:copy;
  background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px calc(var(--hh)/2),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--hh)/2) calc(var(--hh)/2 + 1px),transparent calc(var(--hh)/2 + 1px) var(--hh))}
.blk{position:absolute;border:0;text-align:left;background:var(--ev-bg);color:var(--fg);border-left:4px solid var(--ev-bar);border-radius:6px;padding:4px 8px;overflow:hidden;
  display:flex;flex-direction:column;gap:1px;min-width:0;box-shadow:0 0 0 1px var(--surface)}
.blk .bt{font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.blk .bs{font:500 12px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.blk .bs svg{width:12px;height:12px;flex:none}
.blk.short{flex-direction:row;align-items:center;gap:8px;padding-block:0}
.blk.short .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk.past{opacity:.6}
.nowline{position:absolute;left:-5px;right:0;height:2px;background:var(--now);pointer-events:none;z-index:2}
.nowline::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:clip;touch-action:pan-y}
.wkcols{display:grid;grid-template-columns:40px repeat(var(--nd),minmax(0,1fr))}
.wkhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wkhead .dh{border:0;background:none;border-left:1px solid var(--line);padding:8px 4px 6px 6px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:0}
.wkhead .dh b{font:500 22px/1.1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.wkhead .dh span{font-size:12px;color:var(--muted)}
.wkhead .dh.hoy b{color:var(--fg);display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-fg);border-radius:8px;width:34px;height:30px;margin-left:-4px}
.wkall{border-bottom:1px solid var(--line);min-height:8px}
.wkall .cell{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wkall .blk{position:static}
.wkbody .hrs span{height:var(--hh);font:500 12px var(--body);color:var(--muted);text-align:center;padding-top:4px;display:block}
.wkbody .lane{border-left:1px solid var(--line)}
.wkbody .lane.hoy{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.wk .blk{padding:3px 5px;border-left-width:3px;border-radius:3px}
.wk .blk .bt{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--cl,3);overflow:hidden}
.wk .blk .bs{font:400 11px var(--body)}
.wk .blk.short .bs{display:none}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .m{flex:1;font:700 21px/1.1 var(--display);text-transform:capitalize;background:none;border:0;padding:0;text-align:left;min-width:0}
.calbar .m small{display:block;font:500 13px var(--body);color:var(--muted);text-transform:none}
.monthpick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:15;
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px}

/* pendientes */
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px}
.flag{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.flag[aria-pressed="true"]{background:var(--danger);color:#fff;border-color:var(--danger)}
.flag svg{width:22px;height:22px}
.todos{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;color:transparent}
.todo .chk svg{width:18px;height:18px}
.todo.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.todo .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:left}
.todo .txt span{overflow-wrap:anywhere}
.todo.done .txt span:first-child{text-decoration:line-through;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px var(--body);border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted)}
.tag.urg{background:var(--danger);color:#fff}
.tag.late{color:var(--danger)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font:700 22px var(--display);text-transform:uppercase;letter-spacing:.02em}
.sheet .preview{width:100%;max-height:38vh;object-fit:contain;background:var(--sunk);border-radius:12px;display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.field textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .bar{display:flex;flex-wrap:wrap;gap:10px}
.sheet .bar .btn{flex:1 1 140px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.mic{position:relative}
.mic .iconbtn{position:absolute;right:8px;bottom:8px}
.mic .iconbtn.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--danger)}

.viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .cap{color:#eee;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));white-space:pre-wrap;max-height:30%;overflow:auto}
.viewer .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));background:rgba(0,0,0,.6);color:#fff;border:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.alarm{background:var(--accent);color:var(--accent-fg)}
.status{padding:30px 0;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.hbtn{background:transparent;border:0;color:inherit;width:40px;height:40px;margin-right:-8px;border-radius:10px;display:grid;place-items:center}
.hbtn svg{width:22px;height:22px}
.nag{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nag span{min-width:0;flex:1 1 180px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header class="top gut"><div class="row">
  <button class="back" id="backBtn" hidden aria-label="Volver"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">Cuaderno de Obra</h1>
  <span class="stamp" id="clock"></span>
  <button class="hbtn" id="menuBtn" aria-label="Copia de seguridad y ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
</div></header>

<main class="gut"><div id="app" class="view"><p class="status">Cargando tu cuaderno…</p></div></main>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="obra" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Carpetas</button>
  <button data-tab="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario<span class="badge" id="calBadge" hidden></span></button>
  <button data-tab="pendientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Pendientes<span class="badge" id="todoBadge" hidden></span></button>
</nav>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const FCOL = ["--f1","--f2","--f3","--f4","--f5","--f6"];
const SUGERIDAS = ["Energía","Fontanería","Estructura","Seguridad","Albañilería","Climatización"];
const AVISOS = [["","Sin aviso"],["0","A la hora"],["15","15 min antes"],["60","1 hora antes"],["1440","1 día antes"]];
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number); const dt = new Date(y,m-1,d); return `${DIAS[dt.getDay()]} ${d} de ${MESES[m-1]}`; };
const fmtStamp = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const I = {
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  gal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

let db=null, assets=null, downloads=null, dictation=null;
const S = { folders:[], photos:[], events:[], todos:[], loaded:{}, err:null };
const ui = { tab:"obra", folderId:null, q:"", calMonth:null, calDay:ymd(new Date()), todoFilter:"open", urgentNext:false, uploading:[] };

/* ---------- reloj ---------- */
const tick = () => { const d=new Date(); $("#clock").textContent = `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
tick(); setInterval(tick, 15000);

/* ---------- toast ---------- */
let toastT;
function toast(msg, alarm=false){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className = "toast" + (alarm?" alarm":""); t.textContent = msg;
  t.setAttribute("role","status"); document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), alarm?9000:2600);
}

/* ---------- hoja inferior ---------- */
function sheet(html, onMount){
  closeSheet();
  const s = document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click", e => { if (e.target === s && !s.dataset.lock) closeSheet(); });
  document.body.appendChild(s);
  onMount && onMount(s.firstElementChild);
}
function closeSheet(){ const s=$("#scrim"); if(s){ stopDictation(); s.remove(); if(ui.draft){ ui.draft.items.forEach(it=>URL.revokeObjectURL(it.url)); ui.draft=null; } render(); } }
function confirmSheet(text, okLabel, fn){
  sheet(`<h3>¿Seguro?</h3><p>${esc(text)}</p><div class="bar"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok style="background:var(--danger);color:#fff">${esc(okLabel)}</button></div>`, el=>{
    $("[data-x]",el).onclick = closeSheet;
    $("[data-ok]",el).onclick = async()=>{ closeSheet(); try{ await fn(); }catch(e){ toast("No se ha podido borrar. Revisa la conexión."); } };
  });
}

/* ---------- dictado (opcional) ---------- */
let dictTarget=null;
function stopDictation(){ if(dictation && dictTarget){ dictation.stop().catch(()=>{}); dictTarget=null; } }
function micHtml(){ return dictation ? `<button type="button" class="iconbtn" data-mic aria-label="Dictar por voz">${I.mic}</button>` : ""; }
function wireMic(el, ta){
  const b = $("[data-mic]", el); if(!b) return;
  b.onclick = () => {
    if (dictTarget){ stopDictation(); b.classList.remove("on"); return; }
    dictTarget = ta; b.classList.add("on");
    const base = ta.value ? ta.value.replace(/\s*$/," ") : "";
    let done = base;
    dictation.onFinal(({text}) => { if(dictTarget===ta){ done += text + " "; ta.value = done; } });
    dictation.onPartial(({text}) => { if(dictTarget===ta) ta.value = done + text; });
    dictation.onState(({state}) => { if(state==="idle"){ b.classList.remove("on"); dictTarget=null; } });
    dictation.start().catch(()=>{ b.classList.remove("on"); dictTarget=null; });
  };
}

/* ---------- fotos ---------- */
async function shrink(file, stamp){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const max = 1600, k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    const ctx = c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
    if(stamp && stamp.length) drawStamp(ctx, c.width, c.height, stamp);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",0.82));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}
/* sello de fecha y coordenadas en la esquina inferior derecha */
function drawStamp(ctx, w, h, lines){
  const fs = Math.max(14, Math.round(Math.min(w,h)*0.034));
  ctx.save();
  ctx.font = `500 ${fs}px Arial, Helvetica, sans-serif`;
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.max(2, fs*0.14); ctx.strokeStyle = "rgba(0,0,0,.6)";
  ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = fs*0.25;
  const x = w - fs*0.7; let y = h - fs*0.8;
  for(let i=lines.length-1;i>=0;i--){ ctx.strokeText(lines[i], x, y); ctx.fillStyle="#fff"; ctx.fillText(lines[i], x, y); y -= fs*1.3; }
  ctx.restore();
}
function dms(v){
  const sg = v<0 ? "-" : ""; v = Math.abs(v);
  let d = Math.floor(v), m = Math.floor((v-d)*60), sec = Math.round(((v-d)*60-m)*60);
  if(sec===60){ sec=0; m++; } if(m===60){ m=0; d++; }
  return `${sg}${d}°${pad(m)}'${pad(sec)}"`;
}
function stampLines(when, geo){
  const d = new Date(when), out = [];
  if(geo){
    let l = `${dms(geo.lat)}, ${dms(geo.lon)}`;
    if(geo.alt!=null && isFinite(geo.alt)) l += `, ${geo.alt.toFixed(1).replace(".",",")}m`;
    if(geo.head!=null && isFinite(geo.head)) l += `, ${Math.round(geo.head)}°`;
    out.push(l);
  }
  out.push(`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);
  return out;
}
/* ubicación: se pide al entrar en una carpeta y al hacer foto; si no hay, solo fecha */
function warmGeo(){
  if(!navigator.geolocation) return;
  try{ navigator.geolocation.getCurrentPosition(p=>{ const c=p.coords;
    ui.pos = { lat:c.latitude, lon:c.longitude, alt:c.altitude, head:(c.heading!=null && !isNaN(c.heading))?c.heading:null, t:Date.now() }; },
    ()=>{}, { enableHighAccuracy:true, maximumAge:60000, timeout:20000 }); }catch{}
}
const freshGeo = () => (ui.pos && Date.now()-ui.pos.t < 5*60000) ? ui.pos : null;

const entryAssets = p => (p.assetIds && p.assetIds.length) ? p.assetIds : (p.assetId ? [p.assetId] : []);
const imgSrc = p => { const id = entryAssets(p)[0]; return (id && BLOBURL[id]) || ""; };
const blobSrc = id => BLOBURL[id] || "";

/* ---------- entrada: varias fotos con una descripción ---------- */
function addFiles(files, fromCamera){
  const d = ui.draft; if(!d) return;
  const now = Date.now();
  for(const file of files){
    const when = fromCamera ? ((file.lastModified && Math.abs(now-file.lastModified)<10*60000) ? file.lastModified : now) : (file.lastModified || now);
    d.items.push({ file, url: URL.createObjectURL(file), stamp: stampLines(when, fromCamera ? freshGeo() : null) });
  }
  drawStrip();
}
function drawStrip(){
  const d = ui.draft, el = $("#scrim .sheet"); if(!d || !el) return;
  const total = d.keep.length + d.items.length;
  $("#strip",el).innerHTML =
    d.keep.map((id,i)=>`<div class="th"><img src="${esc(blobSrc(id))}" alt=""><button class="rm" data-rk="${i}" aria-label="Quitar foto">${I.x}</button></div>`).join("") +
    d.items.map((it,i)=>`<div class="th"><img src="${it.url}" alt=""><button class="rm" data-ri="${i}" aria-label="Quitar foto">${I.x}</button></div>`).join("") +
    `<button class="th addt" data-addcam>${I.cam}Otra foto</button><button class="th addt" data-addgal>${I.gal}Galería</button>`;
  $("#phCount",el).textContent = total ? `${total} foto${total===1?"":"s"} con esta descripción` : "Añade al menos una foto";
  el.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{ d.removed.push(d.keep.splice(Number(b.dataset.rk),1)[0]); drawStrip(); });
  el.querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>{ const it=d.items.splice(Number(b.dataset.ri),1)[0]; URL.revokeObjectURL(it.url); drawStrip(); });
  $("[data-addcam]",el).onclick = ()=>{ warmGeo(); $("#camIn").click(); };
  $("[data-addgal]",el).onclick = ()=>$("#galIn").click();
}
function entrySheet(p){
  const folder = S.folders.find(f=>f.id===(p ? p.folderId : ui.folderId)); if(!folder) return;
  ui.draft = { entry:p||null, keep: p ? entryAssets(p).slice() : [], removed:[], items:[] };
  sheet(`<h3>${p?"Editar entrada":"Nueva entrada"} · ${esc(folder.name)}</h3>
    <div class="strip" id="strip"></div>
    <p class="note" id="phCount" style="margin:-4px 0 0"></p>
    <div class="field"><label for="phDesc">Descripción</label>
      <div class="mic"><textarea id="phDesc" placeholder="Ej.: Cuadro general planta 1, falta etiquetar circuitos 4 y 5">${esc(p?p.text:"")}</textarea>${micHtml()}</div></div>
    ${p?`<div class="field"><label for="edFolder">Carpeta</label><select id="edFolder">${S.folders.map(f=>`<option value="${f.id}" ${f.id===p.folderId?"selected":""}>${esc(f.name)}</option>`).join("")}</select></div>`:""}
    <p class="note" id="phNote">Cada foto nueva lleva grabada la fecha y hora${navigator.geolocation?" y, si el móvil lo permite, las coordenadas":""}.</p>
    <div class="bar">
      ${p?`<button class="btn danger" data-del>Borrar entrada</button>`:`<button class="btn" data-x>Cancelar</button>`}
      <button class="btn pri" data-save>Guardar</button>
    </div>`, el => {
    $("#scrim").dataset.lock = "1";
    const ta = $("#phDesc",el); wireMic(el, ta);
    drawStrip();
    $("[data-x]",el)?.addEventListener("click", closeSheet);
    $("[data-del]",el)?.addEventListener("click", ()=>{ const n=entryAssets(p).length;
      confirmSheet(`Se borrará esta entrada con ${n} foto${n===1?"":"s"} y su descripción para siempre.`,"Borrar entrada", async()=>{
        await db.doc("photos/"+p.id).delete(); for(const id of entryAssets(p)) assets.delete(id).catch(()=>{}); toast("Entrada borrada"); }); });
    $("[data-save]",el).onclick = async () => {
      const d = ui.draft; if(!d) return;
      if(!d.keep.length && !d.items.length){ $("#phNote",el).className="note err"; $("#phNote",el).textContent = p ? "No quedan fotos. Si quieres quitarla entera, pulsa “Borrar entrada”." : "Añade al menos una foto."; return; }
      el.querySelectorAll("button").forEach(b=>b.disabled=true);
      const note=$("#phNote",el); note.className="note"; stopDictation();
      try{
        const ids = [];
        for(let i=0;i<d.items.length;i++){
          note.textContent = `Guardando foto ${i+1} de ${d.items.length}…`;
          const blob = await shrink(d.items[i].file, d.items[i].stamp);
          ids.push((await assets.upload(blob, {type:"image/jpeg"})).id);
        }
        const all = [...d.keep, ...ids];
        if(p){
          await db.doc("photos/"+p.id).update({ text: ta.value.trim(), folderId: $("#edFolder",el).value, assetIds: all, assetId: all[0] });
          for(const id of d.removed) assets.delete(id).catch(()=>{});
        } else {
          const g = freshGeo();
          await db.collection("photos").add({ folderId: folder.id, assetIds: all, assetId: all[0], text: ta.value.trim(), createdAt: Date.now(), ...(g?{geo:{lat:g.lat,lon:g.lon}}:{}) });
        }
        closeSheet(); toast(p ? "Guardado" : (all.length>1 ? `${all.length} fotos guardadas` : "Foto guardada"));
      } catch(e){
        el.querySelectorAll("button").forEach(b=>b.disabled=false);
        note.className="note err"; note.textContent="No se ha podido guardar. Puede que no quede espacio en el móvil. Tu texto sigue aquí.";
      }
    };
  });
}
function onPicked(files, fromCamera){
  if(!files.length) return;
  if(!(ui.draft && $("#scrim"))) entrySheet(null);
  addFiles(files, fromCamera);
}
$("#camIn").onchange = e => { const f=[...e.target.files]; e.target.value=""; onPicked(f, true); };
$("#galIn").onchange = e => { const f=[...e.target.files]; e.target.value=""; onPicked(f, false); };

function viewPhoto(p, start=0){
  const ids = entryAssets(p); let i = Math.min(start, ids.length-1);
  const v = document.createElement("div"); v.className="viewer";
  const draw = () => {
    v.innerHTML = `<img src="${esc(blobSrc(ids[i]))}" alt="">
      ${ids.length>1?`<span class="vc">${i+1} / ${ids.length}</span>`:""}
      ${ids.length>1&&i>0?`<button class="nav p" data-p aria-label="Foto anterior">${I.l}</button>`:""}
      ${ids.length>1&&i<ids.length-1?`<button class="nav n" data-n aria-label="Foto siguiente">${I.r}</button>`:""}
      <button class="x" aria-label="Cerrar">${I.x}</button>
      <div class="cap"><span class="stamp">${fmtStamp(p.createdAt)}</span>\n${esc(p.text||"")}</div>`;
    $(".x",v).onclick = () => v.remove();
    $("[data-p]",v)?.addEventListener("click", e=>{ e.stopPropagation(); i--; draw(); });
    $("[data-n]",v)?.addEventListener("click", e=>{ e.stopPropagation(); i++; draw(); });
  };
  let sx=null;
  v.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
  v.addEventListener("touchend", e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>60){ if(dx<0 && i<ids.length-1){ i++; draw(); } else if(dx>0 && i>0){ i--; draw(); } } }, {passive:true});
  draw(); document.body.appendChild(v);
}

/* ---------- carpetas ---------- */
function folderSheet(f){
  let color = f ? f.color : FCOL[S.folders.length % FCOL.length];
  sheet(`<h3>${f?"Editar carpeta":"Nueva carpeta"}</h3>
    <div class="field"><label for="fName">Nombre</label><input id="fName" value="${esc(f?f.name:"")}" placeholder="Ej.: Energía" autocomplete="off"></div>
    <div class="field"><label>Color</label><div class="swatches">${FCOL.map(c=>`<button class="sw" data-c="${c}" style="background:var(${c})" aria-pressed="${c===color}" aria-label="Color"></button>`).join("")}</div></div>
    ${!f?`<div class="chips">${SUGERIDAS.filter(n=>!S.folders.some(x=>x.name===n)).map(n=>`<button class="chip" data-s="${esc(n)}">${esc(n)}</button>`).join("")}</div>`:""}
    <div class="bar">${f?`<button class="btn danger" data-del>Borrar</button>`:`<button class="btn" data-x>Cancelar</button>`}<button class="btn pri" data-ok>${f?"Guardar":"Crear carpeta"}</button></div>`, el=>{
    const inp = $("#fName",el); setTimeout(()=>inp.focus(),60);
    el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ color=b.dataset.c; el.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
    el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ inp.value=b.dataset.s; });
    $("[data-x]",el)?.addEventListener("click", closeSheet);
    const ok = async()=>{ const name=inp.value.trim(); if(!name){ inp.focus(); return; }
      try{ if(f) await db.doc("folders/"+f.id).update({name,color}); else await db.collection("folders").add({name,color,createdAt:Date.now()}); closeSheet(); }
      catch{ toast("No se ha guardado. Revisa la conexión."); } };
    $("[data-ok]",el).onclick = ok; inp.onkeydown = e=>{ if(e.key==="Enter") ok(); };
    $("[data-del]",el)?.addEventListener("click", ()=>{
      const ph = S.photos.filter(p=>p.folderId===f.id); const nph = ph.reduce((n,p)=>n+entryAssets(p).length,0);

const addHour = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); return h>=23 ? "23:59" : `${pad(h+1)}:${pad(m)}`; };
function eventSheet(ev, preset){

function icsFor(ev){
  const ds = ev.date.replace(/-/g,""); const icsEsc = s=>String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const now = new Date(); const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  let start, end;
  if(ev.time){ const t=ev.time.replace(":",""); start=`DTSTART:${ds}T${t}00`; const [h,m]=ev.time.split(":").map(Number); const et = (ev.end && ev.end>ev.time) ? ev.end : addHour(ev.time); end=`DTEND:${ds}T${et.replace(":","")}00`; }
  else { start=`DTSTART;VALUE=DATE:${ds}`; const n=new Date(ev.date+"T12:00"); n.setDate(n.getDate()+1); end=`DTEND;VALUE=DATE:${ymd(n).replace(/-/g,"")}`; }
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cuaderno de Obra//ES","BEGIN:VEVENT",`UID:${ev.id}@cuaderno-obra`,`DTSTAMP:${stamp}`,start,end,`SUMMARY:${icsEsc(ev.title)}`, ev.notes?`DESCRIPTION:${icsEsc(ev.notes)}`:""];
  if(ev.alarm!=="" && ev.alarm!=null){ const mins = ev.time ? Number(ev.alarm) : Math.max(0, Number(ev.alarm) - 0); lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(ev.title)}`,`TRIGGER:-PT${mins}M`,"END:VALARM"); }
  lines.push("END:VEVENT","END:VCALENDAR");
  return lines.filter(Boolean).join("\r\n");
}
async function exportIcs(ev){
  if(!downloads){ toast("Descargar no está disponible aquí. Ábrelo en el navegador del móvil."); return; }
  const name = (ev.title||"aviso").normalize("NFD").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "aviso";
  try{ await downloads.save({ filename: `${name}.ics`, data: new Blob([icsFor(ev)],{type:"text/calendar"}) }); toast("Abre el archivo para añadirlo a tu calendario"); }
  catch(e){ if(e && e.code==="declined") return; toast("No se ha podido generar el archivo del calendario."); }
}
const evStart = ev => new Date(`${ev.date}T${ev.time||"08:00"}`);
const evAlarmAt = ev => (ev.alarm===""||ev.alarm==null) ? null : new Date(evStart(ev).getTime() - Number(ev.alarm)*60000);

/* aviso dentro de la app mientras está abierta */
const fired = new Set((()=>{ try{ return JSON.parse(localStorage.getItem("avisados")||"[]"); }catch{ return []; } })());
function checkAlarms(){
  const now = Date.now();
  for(const ev of S.events){
    const at = evAlarmAt(ev); if(!at) continue;
    const key = ev.id+"@"+at.getTime();
    if(now >= at.getTime() && now - at.getTime() < 6*3600000 && !fired.has(key)){
      fired.add(key); try{ localStorage.setItem("avisados", JSON.stringify([...fired].slice(-200))); }catch{}
      toast(`Aviso: ${ev.title}${ev.time?" · "+ev.time:""}`, true); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch{}
    }
  }
}

const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function evRange(e){ const st=toMin(e.time); let en=e.end?toMin(e.end):st+60; if(en<=st) en=st+60; return [st,Math.min(en,24*60)]; }
function layoutDay(evs){
  const items = evs.map(e=>{ const [st,en]=evRange(e); return {e,st,en,col:0,cols:1}; }).sort((a,b)=>a.st-b.st||b.en-a.en);
  let cluster=[], clusterEnd=-1;
  const flush=()=>{ const n=Math.max(1,...cluster.map(i=>i.col+1)); cluster.forEach(i=>i.cols=n); cluster=[]; };
  for(const it of items){
    if(it.st>=clusterEnd && cluster.length) flush();
    const used=new Set(cluster.filter(c=>c.en>it.st).map(c=>c.col)); let c=0; while(used.has(c)) c++;
    it.col=c; cluster.push(it); clusterEnd=Math.max(clusterEnd,it.en);
  }
  if(cluster.length) flush();
  return items;
}
function renderCal(){
  setTitle("Calendario", false);
  const now = new Date(), todayS = ymd(now), nowMin = now.getHours()*60+now.getMinutes();
  const sel = new Date(ui.calDay+"T12:00");
  const mon = new Date(sel); mon.setDate(sel.getDate()-((sel.getDay()+6)%7));
  const byDay = {}; for(const e of S.events){ (byDay[e.date]=byDay[e.date]||[]).push(e); }
  const days7 = Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
  const weekendHas = days7.slice(5).some(d=>(byDay[ymd(d)]||[]).length);
  const days = (ui.weekend || weekendHas) ? days7 : days7.slice(0,5);
  const keys = days.map(ymd);
  const DSH = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  let h0=8, h1=18;
  const lay = {};
  for(const k of keys){ lay[k]=layoutDay((byDay[k]||[]).filter(e=>e.time)); for(const it of lay[k]){ h0=Math.min(h0,Math.floor(it.st/60)); h1=Math.max(h1,Math.ceil(it.en/60)); } }
  if(keys.includes(todayS)){ h0=Math.min(h0,now.getHours()); h1=Math.max(h1,now.getHours()+1); }
  h1=Math.min(h1,24);
  const HH=56, px = mins => (mins-h0*60)/60*HH;
  const fmtT = mins => `${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}`;
  const last = days[days.length-1];
  const range = mon.getMonth()===last.getMonth() ? `${mon.getDate()} – ${last.getDate()} ${MESES[last.getMonth()]}` : `${mon.getDate()} ${MESES[mon.getMonth()].slice(0,3)} – ${last.getDate()} ${MESES[last.getMonth()].slice(0,3)}`;
  const hasAll = keys.some(k=>(byDay[k]||[]).some(e=>!e.time));
  const inWeek = keys.includes(todayS);
  let picker = "";
  if(ui.monthOpen){
    const y=sel.getFullYear(), m=sel.getMonth()+1, first=new Date(y,m-1,1), off=(first.getDay()+6)%7;
    let cells=[]; for(let i=0;i<42;i++) cells.push(new Date(y,m-1,1-off+i));
    if(cells.slice(35).every(d=>d.getMonth()!==m-1)) cells=cells.slice(0,35);
    picker = `<section class="monthpick"><div class="secrow" style="margin-bottom:6px"><button class="iconbtn" data-pm="-1" aria-label="Mes anterior">${I.l}</button><strong style="font:700 18px var(--display);text-transform:capitalize">${MESES[m-1]} ${y}</strong><button class="iconbtn" data-pm="1" aria-label="Mes siguiente">${I.r}</button></div>
      <div class="grid7">${["L","M","X","J","V","S","D"].map(d=>`<span class="dow">${d}</span>`).join("")}${cells.map(d=>{ const k=ymd(d), n=(byDay[k]||[]).length;
      return `<button class="day ${d.getMonth()!==m-1?"out":""} ${k===todayS?"today":""}" data-d="${k}" aria-pressed="${keys.includes(k)}">${d.getDate()}<span class="dots">${"<i></i>".repeat(Math.min(n,3))}</span></button>`; }).join("")}</div></section>`;
  }
  app.innerHTML = `
    <div class="calbar">
      <button class="m" data-month aria-expanded="${!!ui.monthOpen}">${esc(range)}<small>${sel.getFullYear()} · ${ui.monthOpen?"cerrar mes":"ver mes"}</small></button>
      ${!inWeek?`<button class="btn sm" data-today>Hoy</button>`:""}
      <button class="iconbtn" data-mv="-1" aria-label="Semana anterior">${I.l}</button>
      <button class="iconbtn" data-mv="1" aria-label="Semana siguiente">${I.r}</button>
    </div>
    ${picker}
    <section class="wk" id="agenda" aria-label="Semana" style="--nd:${days.length}">
      <div class="wkcols wkhead"><span></span>${days.map(d=>`<button class="dh ${ymd(d)===todayS?"hoy":""}" data-nd="${ymd(d)}" aria-label="Nueva reunión el ${esc(fmtDate(ymd(d)))}"><b>${pad(d.getDate())}</b><span>${DSH[d.getDay()]}</span></button>`).join("")}</div>
      ${hasAll?`<div class="wkcols wkall"><span></span>${keys.map(k=>`<div class="cell">${(byDay[k]||[]).filter(e=>!e.time).map(e=>`<button class="blk short" data-ev="${e.id}"><span class="bt" style="--cl:2">${esc(e.title)}</span></button>`).join("")}</div>`).join("")}</div>`:""}
      <div class="wkcols wkbody">
        <div class="hrs">${Array.from({length:h1-h0},(_,i)=>`<span>${h0+i}</span>`).join("")}</div>
        ${keys.map(k=>`<div class="lane ${k===todayS?"hoy":""}" data-lane="${k}" style="height:${(h1-h0)*HH}px;--hh:${HH}px">
          ${lay[k].map(it=>{ const top=px(it.st), h=Math.max(px(it.en)-top,22), w=100/it.cols, past = k<todayS || (k===todayS && it.en<nowMin);
            const lines=Math.max(1,Math.floor((h-(h>=46?18:6))/14.5));
            return `<button class="blk ${h<46?"short":""} ${past?"past":""}" data-ev="${it.e.id}" style="top:${top+1}px;height:${h-2}px;left:calc(${it.col*w}% + 2px);width:calc(${w}% - 4px);--cl:${lines}" aria-label="${esc(it.e.title)}, ${fmtT(it.st)} a ${fmtT(it.en)}">
              <span class="bt">${esc(it.e.title)}</span><span class="bs">${fmtT(it.st)}${(it.e.alarm!==""&&it.e.alarm!=null)?" "+I.bell:""}</span></button>`; }).join("")}
          ${k===todayS?`<div class="nowline" style="top:${px(nowMin)}px"></div>`:""}
        </div>`).join("")}
      </div>
    </section>
    <div class="secrow"><p class="note" style="margin:0">Toca un hueco para poner una reunión a esa hora. Desliza para cambiar de semana.</p>
      <button class="chip" data-we aria-pressed="${days.length===7}">Sáb y dom</button></div>
    <button class="fab" data-new aria-label="Nueva reunión o aviso">${I.plus}</button>
  `;
  const go = k => { ui.calDay=k; render(); };
  const shift = n => { const x=new Date(ui.calDay+"T12:00"); x.setDate(x.getDate()+n); return ymd(x); };
  $("[data-month]",app).onclick=()=>{ ui.monthOpen=!ui.monthOpen; render(); };
  $("[data-today]",app)?.addEventListener("click",()=>go(todayS));
  app.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>go(shift(7*Number(b.dataset.mv))));
  app.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ const x=new Date(sel.getFullYear(),sel.getMonth()+Number(b.dataset.pm),1); go(ymd(x)); });
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ ui.monthOpen=false; go(b.dataset.d); });
  $("[data-we]",app).onclick=()=>{ ui.weekend=!ui.weekend; render(); };
  app.querySelectorAll("[data-ev]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); eventSheet(S.events.find(x=>x.id===b.dataset.ev)); });
  app.querySelectorAll("[data-nd]").forEach(b=>b.onclick=()=>{ ui.calDay=b.dataset.nd; eventSheet(null); });
  $("[data-new]",app).onclick=()=>{ if(!inWeek && ui.calDay===todayS) ui.calDay=keys[0]; eventSheet(null); };
  app.querySelectorAll("[data-lane]").forEach(l=>l.onclick=e=>{ if(e.target!==l) return; const r=l.getBoundingClientRect();
    const mins=h0*60+Math.floor(((e.clientY-r.top)/HH*60)/30)*30; ui.calDay=l.dataset.lane; eventSheet(null, fmtT(Math.min(mins,23*60+30))); });
  const ag=$("#agenda",app); let sx=null, sy=null;
  ag.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  ag.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5) go(shift(dx<0?7:-7)); },{passive:true});
}
setInterval(()=>{ if(ui.tab==="calendario" && !$("#scrim")) render(); }, 60000);

function renderTodos(){
  setTitle("Pendientes", false);
  const today = ymd(new Date());
  const open = S.todos.filter(t=>!t.done).sort((a,b)=> (b.urgent?1:0)-(a.urgent?1:0) || (a.due||"9999").localeCompare(b.due||"9999") || a.createdAt-b.createdAt);
  const done = S.todos.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const list = ui.todoFilter==="open" ? open : done;
  const fname = id => S.folders.find(f=>f.id===id)?.name;
  const hadFocus = document.activeElement && document.activeElement.id==="tq";
  app.innerHTML = `
    <form class="quick" id="tform"><input id="tq" placeholder="Apuntar pendiente…" autocomplete="off" enterkeyhint="done">
      <button type="button" class="flag" id="tflag" aria-pressed="${ui.urgentNext}" aria-label="Marcar como urgente">${I.flag}</button>
      <button class="btn pri" aria-label="Añadir">${I.plus}</button></form>
    <div class="chips"><button class="chip" data-tf="open" aria-pressed="${ui.todoFilter==="open"}">Por hacer · ${open.length}</button><button class="chip" data-tf="done" aria-pressed="${ui.todoFilter==="done"}">Hechos · ${done.length}</button></div>
    ${list.length?`<div class="todos">${list.map(t=>`<div class="todo ${t.done?"done":""}">
      <button class="chk" data-tg="${t.id}" aria-label="${t.done?"Marcar como no hecho":"Marcar como hecho"}">${I.check}</button>
      <button class="txt" data-te="${t.id}"><span>${esc(t.text)}</span>
        <span class="tags">${t.urgent&&!t.done?`<span class="tag urg">Urgente</span>`:""}${t.due?`<span class="tag ${!t.done&&t.due<today?"late":""}">${t.due===today?"Hoy":esc(fmtDate(t.due))}</span>`:""}${fname(t.folderId)?`<span class="tag">${esc(fname(t.folderId))}</span>`:""}</span></button>
    </div>`).join("")}</div>`
    : `<div class="emptybox"><span>${ui.todoFilter==="open"?"Nada pendiente. Escribe arriba y pulsa +; la bandera lo marca como urgente.":"Aún no has terminado ninguno."}</span></div>`}
    ${ui.todoFilter==="done"&&done.length?`<button class="btn ghost danger" data-clear>Borrar los hechos</button>`:""}
    <p class="note">Toca un pendiente para ponerle fecha, carpeta o marcarlo urgente.</p>
  `;
  const inp=$("#tq",app); if(hadFocus) inp.focus();
  $("#tflag",app).onclick=()=>{ ui.urgentNext=!ui.urgentNext; $("#tflag",app).setAttribute("aria-pressed",ui.urgentNext); };
  $("#tform",app).onsubmit=async e=>{ e.preventDefault(); const text=inp.value.trim(); if(!text) return; inp.value="";
    const urgent=ui.urgentNext; ui.urgentNext=false;
    try{ await db.collection("todos").add({text,done:false,urgent,due:"",folderId:"",createdAt:Date.now()}); }catch{ inp.value=text; toast("No se ha guardado. Revisa la conexión."); } };
  app.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{ ui.todoFilter=b.dataset.tf; render(); });
  app.querySelectorAll("[data-tg]").forEach(b=>b.onclick=async()=>{ const t=S.todos.find(x=>x.id===b.dataset.tg); try{ await db.doc("todos/"+t.id).update({done:!t.done,doneAt:t.done?0:Date.now()}); if(!t.done) toast("¡Hecho!"); }catch{ toast("No se ha guardado."); } });
  app.querySelectorAll("[data-te]").forEach(b=>b.onclick=()=>todoSheet(S.todos.find(x=>x.id===b.dataset.te)));
  $("[data-clear]",app)?.addEventListener("click",()=>confirmSheet(`Se borrarán ${done.length} pendientes ya hechos.`,"Borrar", async()=>{ for(const t of done) await db.doc("todos/"+t.id).delete(); }));
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ if(ui.tab===b.dataset.tab && b.dataset.tab==="obra") ui.folderId=null; ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
$("#backBtn").onclick=()=>{ ui.folderId=null; render(); };

/* ---------- arranque ---------- */
/* ================= almacenamiento en el móvil (IndexedDB) ================= */
const STORES = ["folders","photos","events","todos","blobs"];
const BLOBURL = {};
let idbP = null;
function idb(){ return idbP || (idbP = new Promise((ok,ko)=>{
  const r = indexedDB.open("cuaderno-obra", 1);
  r.onupgradeneeded = () => { const d=r.result; for(const n of STORES) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:"id"}); };
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
})); }
const rq = r => new Promise((ok,ko)=>{ r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); });
async function store(name, mode="readonly"){ return (await idb()).transaction(name, mode).objectStore(name); }
const getAll = async n => rq((await store(n)).getAll());
const getOne = async (n,id) => rq((await store(n)).get(id));
const putOne = async (n,o) => rq((await store(n,"readwrite")).put(o));
const delOne = async (n,id) => rq((await store(n,"readwrite")).delete(id));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const listeners = {};
async function emit(name){
  const all = await getAll(name);
  for(const l of listeners[name]||[]){
    let docs = all.slice();
    if(l.order){ const [f,dir]=l.order; docs.sort((a,b)=>((a[f]>b[f])-(a[f]<b[f]))*(dir==="desc"?-1:1)); }
    l.cb({ docs: docs.map(x=>({ id:x.id, data:()=>x })) });
  }
}
function localCollection(name, order){
  return {
    orderBy:(f,dir="asc")=>localCollection(name,[f,dir]),
    onSnapshot(cb){ (listeners[name]=listeners[name]||[]).push({cb,order}); emit(name).catch(()=>{}); return ()=>{}; },
    async add(data){ const id=uid(); await putOne(name,{...data,id}); emit(name); return {id}; },
  };
}
db = {
  collection: name => localCollection(name),
  doc(path){ const [name,id]=path.split("/"); return {
    async update(patch){ const cur=await getOne(name,id); if(!cur) throw new Error("missing"); await putOne(name,{...cur,...patch,id}); emit(name); },
    async delete(){ await delOne(name,id); emit(name); },
  }; },
};
assets = {
  async upload(blob){ const id=uid(); await putOne("blobs",{id,blob,type:blob.type||"image/jpeg"}); BLOBURL[id]=URL.createObjectURL(blob); return {id,url:BLOBURL[id]}; },
  async delete(id){ await delOne("blobs",id); if(BLOBURL[id]){ URL.revokeObjectURL(BLOBURL[id]); delete BLOBURL[id]; } return {deleted:true}; },
};
function saveFile(filename, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
downloads = { async save({filename,data}){ saveFile(filename, data instanceof Blob ? data : new Blob([data])); return {status:"saved"}; } };

/* ================= copia de seguridad ================= */
const LS = { get:k=>{ try{ return localStorage.getItem(k); }catch{ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch{} } };
const blobToB64 = b => new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=()=>ko(r.error); r.readAsDataURL(b); });
const b64ToBlob = (b64,type) => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); };
const fmtBytes = n => n>1e9 ? (n/1e9).toFixed(1)+" GB" : n>1e6 ? Math.round(n/1e6)+" MB" : Math.max(1,Math.round(n/1e3))+" kB";
function backupNag(){
  if(!S.photos.length && !S.todos.length && !S.events.length) return "";
  const last = Number(LS.get("ultimaCopia")||0); const days = last ? Math.floor((Date.now()-last)/864e5) : null;
  if(days!==null && days<7) return "";
  return `<div class="nag"><span>${days===null?"Aún no has hecho ninguna copia de seguridad.":`Tu última copia fue hace ${days} días.`} Si pierdes el móvil, la copia es lo que te salva las fotos.</span><button class="btn sm pri" data-backup>Hacer copia</button></div>`;
}
async function makeBackup(btn, note){
  btn.disabled=true; note.className="note"; note.textContent="Preparando copia…";
  try{
    const data = { app:"cuaderno-obra", version:1, exportedAt:new Date().toISOString() };
    for(const n of ["folders","photos","events","todos"]) data[n]=await getAll(n);
    const blobs = await getAll("blobs"); data.blobs=[];
    for(let i=0;i<blobs.length;i++){ note.textContent=`Preparando fotos ${i+1} de ${blobs.length}…`; data.blobs.push({id:blobs[i].id,type:blobs[i].type,b64:await blobToB64(blobs[i].blob)}); }
    const d=new Date(); const name=`cuaderno-obra-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const file = new File([JSON.stringify(data)], name, {type:"application/json"});
    let shared=false;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"Copia Cuaderno de Obra"}); shared=true; }
      catch(e){ if(e && e.name==="AbortError"){ btn.disabled=false; note.textContent="Copia cancelada."; return; } }
    }
    if(!shared) saveFile(name, file);
    LS.set("ultimaCopia", String(Date.now()));
    note.textContent = shared ? `Copia lista (${fmtBytes(file.size)}). Guárdala en Google Drive, el correo o el ordenador.` : `Copia descargada (${fmtBytes(file.size)}): está en Descargas. Pásala a Drive o al ordenador.`;
  }catch(e){ note.className="note err"; note.textContent="No se ha podido hacer la copia. Puede que no quede espacio en el móvil."; }
  btn.disabled=false;
}
async function restoreBackup(file, note){
  note.className="note"; note.textContent="Leyendo copia…";
  let data; try{ data=JSON.parse(await file.text()); }catch{ note.className="note err"; note.textContent="Ese archivo no es una copia del cuaderno."; return; }
  if(!data || data.app!=="cuaderno-obra"){ note.className="note err"; note.textContent="Ese archivo no es una copia del cuaderno."; return; }
  const n=(data.photos||[]).length;
  confirmSheet(`Se sustituirá todo lo que hay ahora en este móvil por la copia del ${new Date(data.exportedAt).toLocaleDateString("es-ES")} (${n} fotos).`, "Restaurar copia", async()=>{
    toast("Restaurando…");
    for(const st of STORES) await rq((await store(st,"readwrite")).clear());
    for(const k in BLOBURL){ URL.revokeObjectURL(BLOBURL[k]); delete BLOBURL[k]; }
    for(const b of data.blobs||[]){ const blob=b64ToBlob(b.b64,b.type||"image/jpeg"); await putOne("blobs",{id:b.id,blob,type:b.type}); BLOBURL[b.id]=URL.createObjectURL(blob); }
    for(const n of ["folders","photos","events","todos"]) for(const o of data[n]||[]) await putOne(n,o);
    for(const n of ["folders","photos","events","todos"]) await emit(n);
    toast("Copia restaurada");
  });
}
async function backupSheet(){
  let est=null, persisted=false;
  try{ est = await navigator.storage?.estimate?.(); persisted = await navigator.storage?.persisted?.(); }catch{}
  const last = Number(LS.get("ultimaCopia")||0);
  sheet(`<h3>Tus datos</h3>
    <dl class="kv">
      <dt>Fotos</dt><dd>${S.photos.length} en ${S.folders.length} carpetas</dd>
      <dt>Espacio usado</dt><dd>${est?fmtBytes(est.usage||0):"—"}</dd>
      <dt>Guardado fijo</dt><dd>${persisted?"Sí, el móvil no lo borrará solo":"No confirmado (instala la app en la pantalla de inicio)"}</dd>
      <dt>Última copia</dt><dd>${last?new Date(last).toLocaleDateString("es-ES"):"Nunca"}</dd>
    </dl>
    <p class="note">Todo se guarda solo en este móvil. Haz una copia de vez en cuando y guárdala en Drive o en el ordenador: con ella recuperas todo en un móvil nuevo.</p>
    <button class="btn pri" data-mk>Hacer copia de seguridad</button>
    <button class="btn" data-rs>Restaurar desde una copia</button>
    <input type="file" id="rsIn" accept="application/json,.json" hidden>
    <p class="note" id="bkNote" role="status"></p>
    <button class="btn ghost" data-x>Cerrar</button>`, el=>{
    const note=$("#bkNote",el);
    $("[data-mk]",el).onclick = e => makeBackup(e.currentTarget, note);
    $("[data-rs]",el).onclick = () => $("#rsIn",el).click();
    $("#rsIn",el).onchange = e => { const f=e.target.files[0]; e.target.value=""; if(f) restoreBackup(f, note); };
    $("[data-x]",el).onclick = closeSheet;
  });
}
$("#menuBtn").onclick = backupSheet;

/* ================= arranque ================= */
async function start(){
  try{
    await idb();
    for(const b of await getAll("blobs")) BLOBURL[b.id]=URL.createObjectURL(b.blob);
  }catch(e){ S.err="Este navegador no deja guardar datos (¿modo incógnito?). Ábrela en una ventana normal."; return render(); }
  try{ navigator.storage?.persist?.(); }catch{}
  const sub = (name, q) => q.onSnapshot(snap=>{
    S[name] = snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded[name]=true;
    if(name==="events") checkAlarms();
    if(!$("#scrim")) render(); else badges();
  });
  sub("folders", db.collection("folders").orderBy("createdAt","asc"));
  sub("photos", db.collection("photos").orderBy("createdAt","desc"));
  sub("events", db.collection("events"));
  sub("todos", db.collection("todos"));
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
start();
})();
</script>
